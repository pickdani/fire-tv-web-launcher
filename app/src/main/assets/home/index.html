<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Lay out the page for a 1920-wide screen. The TV scales it to fit. -->
  <meta name="viewport" content="width=1920">
  <title>Fire TV Web Launcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background" id="background-a"></div>
  <div class="background" id="background-b"></div>
  <div id="shade"></div>

  <header>
    <div id="clock">
      <div id="time">--:--</div>
      <div id="date"></div>
    </div>
    <div id="weather" hidden>
      <div id="weather-now"><span id="weather-icon"></span><span id="weather-temp"></span></div>
      <div id="weather-detail"></div>
    </div>
  </header>

  <main>
    <section id="favorites-section">
      <div class="row" id="favorites"></div>
    </section>

    <section id="all-section" hidden>
      <h2>All apps</h2>
      <div class="grid" id="all-apps"></div>
    </section>
  </main>

  <footer>
    <button class="pill" id="btn-all">All apps</button>
    <button class="pill" id="btn-settings">Settings</button>
    <button class="pill" id="btn-amazon">Amazon home</button>
  </footer>

  <script type="module" src="main.js"></script>
</body>
</html>
